plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		url = 'https://keksuccino.github.io/maven/'
	}
	maven {
		name = 'Cloth Config'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"craftleste" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "de.keksuccino:rinku-fabric:${project.rinku_version}"

	// Cloth Config is the presentation layer for craftleste's settings. It is a hard dependency on
	// purpose: the settings screen is the supported way to edit the values, and Cloth Config is LGPLv3.
	// Plain implementation (not modImplementation) because Loom 1.18 with Mojang mappings needs no
	// remap of this jar, exactly like fabric-api and rinku above.
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	// Mod Menu is optional and compile-only: when it is installed the settings screen also appears as
	// the config button in its mod list, and when it is not, the config command still opens it.
	// localRuntime puts it in the development client so that button can be tested locally.
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive(false)
	}
	localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive(false)
	}

	// The official Webleste build is published as a zstd-compressed tar (see WeblesteDownloader),
	// and neither zstd nor tar is in the JDK. Both libraries are open source (BSD-2-Clause and
	// Apache-2.0) utility codecs, not game runtimes, and they are JiJ-bundled so a player only
	// needs craftleste.jar itself. The game runtime (Webleste) is still fetched at runtime from
	// its official origin and is never bundled - that boundary is untouched by these two.
	implementation "com.github.luben:zstd-jni:${project.zstd_version}"
	include "com.github.luben:zstd-jni:${project.zstd_version}"

	implementation "org.apache.commons:commons-compress:${project.commons_compress_version}"
	include "org.apache.commons:commons-compress:${project.commons_compress_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Surface deprecations while they are still warnings; the mod carries no legacy API debt.
	it.options.compilerArgs << "-Xlint:deprecation"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
