# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
maven_group=com.craftleste
archives_base_name=craftleste
version=0.1.0+26.2

# Dependencies
fabric_api_version=0.161.0+26.2

# Cloth Config (26.2 line, LGPLv3) backs the settings screen.
cloth_config_version=26.2.155

# Mod Menu is only used to offer the settings screen as its config button; the mod loads without it.
modmenu_version=20.0.3

# Rinku
rinku_version=3.0.4-26.2

# Webleste runtime handling: the official build is published as a zstd-compressed tar, so
# decompression needs an open codec library. Both are JiJ-bundled (see build.gradle); they are
# utility libraries under the same boundary rules as any other dependency, not game runtimes.
zstd_version=1.5.7-23
commons_compress_version=1.28.0

# Tests
junit_version=5.13.4
